<text x="40" y="58" font-size="26" font-weight="800" fill="#0B1F3A">The cost of trying to time the market</text>
<text x="40" y="90" font-size="17" fill="#52606D">What $1 invested in US stocks in January 1990 became by mid-2023, total return</text><text x="40" y="188" font-size="19" font-weight="600" fill="#0B1F3A">Stayed invested</text><rect x="390" y="150" width="628" height="58" fill="#0F6E8C" rx="3"/><text x="1032" y="180" font-size="24" font-weight="800" fill="#0B1F3A">$25.1</text><text x="1032" y="202" font-size="14" fill="#52606D">10.1% a year</text><text x="40" y="293" font-size="19" font-weight="600" fill="#0B1F3A">Missed the 5 best months</text><rect x="390" y="255" width="382" height="58" fill="#E8573C" rx="3"/><text x="786" y="285" font-size="24" font-weight="800" fill="#0B1F3A">$15.3</text><text x="786" y="307" font-size="14" fill="#52606D">8.5% a year</text><text x="40" y="398" font-size="19" font-weight="600" fill="#0B1F3A">Missed the 10 best months</text><rect x="390" y="360" width="273" height="58" fill="#E8573C" rx="3"/><text x="677" y="390" font-size="24" font-weight="800" fill="#0B1F3A">$10.9</text><text x="677" y="412" font-size="14" fill="#52606D">7.4% a year</text><text x="40" y="503" font-size="19" font-weight="600" fill="#0B1F3A">Missed the 20 best months</text><rect x="390" y="465" width="151" height="58" fill="#E8573C" rx="3"/><text x="555" y="495" font-size="24" font-weight="800" fill="#0B1F3A">$6.0</text><text x="555" y="517" font-size="14" fill="#52606D">5.5% a year</text>
<line x1="40" y1="627" x2="1160" y2="627" stroke="#E3E8EE"/>
<text x="40" y="653" font-size="13" fill="#7B8794">Source: Robert Shiller data (monthly averages, nominal); analysis by Mohamed Ramadan.</text><text x="1160" y="653" font-size="13" font-weight="700" fill="#0F6E8C" text-anchor="end">moharamadan.com</text></svg>