# Espace de publication : moharamadan.com/admin (ou mohamednjikam-site.vercel.app/admin)
# Connexion avec une clé GitHub (voir README.md). Chaque « Publier » met le site à jour en une minute environ.
backend:
  name: github
  repo: njikam2030-sketch/mohamednjikam-site
  branch: main

locale: fr
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: articles
    label: "Articles"
    label_singular: "Article"
    description: "Analyses, tribunes (Opinion) et essais longs (The Long Read). Les sources vont à la fin, sous un titre « Sources ». Pour intégrer une vidéo dans le texte, collez le lien YouTube seul sur une ligne."
    folder: content/articles
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{type}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: standfirst, label: "Chapeau (deux phrases sous le titre)", widget: text }
      - { name: date, label: "Date", widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - name: type
        label: "Genre"
        widget: select
        default: analysis
        options:
          - { label: "Analyse", value: analysis }
          - { label: "Tribune (Opinion)", value: opinion }
          - { label: "Essai long (The Long Read)", value: essay }
      - name: sections
        label: "Rubriques"
        widget: select
        multiple: true
        min: 1
        options:
          - { label: "Economics", value: economics }
          - { label: "Finance", value: finance }
          - { label: "AI", value: ai }
          - { label: "Leadership", value: leadership }
          - { label: "Africa", value: africa }
          - { label: "World", value: world }
      - name: countries
        label: "Pays concernés (barre « Countries »)"
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Burkina Faso", value: BF }
          - { label: "Cameroon", value: CM }
          - { label: "Central African Republic", value: CF }
          - { label: "Chad", value: TD }
          - { label: "China", value: CN }
          - { label: "Congo", value: CG }
          - { label: "Côte d'Ivoire", value: CI }
          - { label: "DR Congo", value: CD }
          - { label: "Egypt", value: EG }
          - { label: "Equatorial Guinea", value: GQ }
          - { label: "Ethiopia", value: ET }
          - { label: "France", value: FR }
          - { label: "Gabon", value: GA }
          - { label: "Germany", value: DE }
          - { label: "Ghana", value: GH }
          - { label: "India", value: IN }
          - { label: "Japan", value: JP }
          - { label: "Kenya", value: KE }
          - { label: "Morocco", value: MA }
          - { label: "Mozambique", value: MZ }
          - { label: "Nigeria", value: NG }
          - { label: "Rwanda", value: RW }
          - { label: "Saudi Arabia", value: SA }
          - { label: "Senegal", value: SN }
          - { label: "Singapore", value: SG }
          - { label: "South Africa", value: ZA }
          - { label: "South Korea", value: KR }
          - { label: "Tanzania", value: TZ }
          - { label: "Uganda", value: UG }
          - { label: "United Arab Emirates", value: AE }
          - { label: "United Kingdom", value: GB }
          - { label: "United States", value: US }
          - { label: "Zambia", value: ZM }
      - { name: image, label: "Photo (grande, horizontale)", widget: image, required: false }
      - { name: image_alt, label: "Description de la photo", widget: string, required: false }
      - { name: image_credit, label: "Crédit photo (ex. Photo: Pexels)", widget: string, required: false }
      - { name: lead, label: "Grand titre de la une", widget: boolean, default: false, required: false }
      - { name: second, label: "Deuxième article de la une", widget: boolean, default: false, required: false }
      - { name: pick, label: "Dans « Editor's picks »", widget: boolean, default: false, required: false }
      - { name: budget, label: "Dossier UK Budget 2026", widget: boolean, default: false, required: false }
      - { name: video, label: "Vidéo YouTube en tête d'article (lien, facultatif)", widget: string, required: false }
      - { name: video_caption, label: "Légende de la vidéo", widget: string, required: false }
      - { name: linkedin, label: "Lien LinkedIn (facultatif)", widget: string, required: false }
      - { name: pdf, label: "PDF principal à télécharger (facultatif)", widget: file, required: false, media_folder: /public/documents, public_folder: /documents }
      - name: documents
        label: "Autres documents PDF"
        widget: list
        required: false
        fields:
          - { name: title, label: "Titre", widget: string }
          - { name: file, label: "Fichier", widget: file, media_folder: /public/documents, public_folder: /documents }
      - name: links
        label: "Liens (sources, lectures, vidéos externes)"
        widget: list
        required: false
        fields:
          - { name: title, label: "Titre", widget: string }
          - { name: url, label: "Adresse (https://…)", widget: string }
          - { name: source, label: "Média (facultatif, ex. Financial Times)", widget: string, required: false }
      - { name: draft, label: "Brouillon (non publié)", widget: boolean, default: false, required: false }
      - { name: body, label: "Texte", widget: markdown }

  - name: notes
    label: "Notes"
    label_singular: "Note"
    description: "Une citation et votre commentaire."
    folder: content/notes
    create: true
    slug: "{{slug}}"
    identifier_field: quote
    summary: "{{author}} · {{quote}}"
    sortable_fields: [order, author]
    fields:
      - name: desk
        label: "Rubrique"
        widget: select
        options:
          - { label: "Economics", value: economics }
          - { label: "Finance", value: finance }
          - { label: "Leadership", value: leadership }
          - { label: "AI", value: ai }
          - { label: "Africa", value: africa }
      - { name: quote, label: "Citation (sans guillemets)", widget: text }
      - { name: author, label: "Auteur, œuvre, année", widget: string }
      - { name: order, label: "Ordre d'affichage (1 = en premier)", widget: number, value_type: int, required: false }
      - { name: draft, label: "Brouillon", widget: boolean, default: false, required: false }
      - { name: body, label: "Commentaire", widget: markdown }

  - name: charts
    label: "Graphiques"
    label_singular: "Graphique"
    folder: content/charts
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: date, label: "Date", widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: image, label: "Image du graphique (SVG, PNG ou JPG)", widget: image }
      - { name: source, label: "Source", widget: string }
      - { name: sections, label: "Rubriques", widget: select, multiple: true, options: [economics, finance, ai, leadership, africa, world] }
      - name: countries
        label: "Pays"
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Burkina Faso", value: BF }
          - { label: "Cameroon", value: CM }
          - { label: "Central African Republic", value: CF }
          - { label: "Chad", value: TD }
          - { label: "China", value: CN }
          - { label: "Congo", value: CG }
          - { label: "Côte d'Ivoire", value: CI }
          - { label: "DR Congo", value: CD }
          - { label: "Egypt", value: EG }
          - { label: "Equatorial Guinea", value: GQ }
          - { label: "Ethiopia", value: ET }
          - { label: "France", value: FR }
          - { label: "Gabon", value: GA }
          - { label: "Germany", value: DE }
          - { label: "Ghana", value: GH }
          - { label: "India", value: IN }
          - { label: "Japan", value: JP }
          - { label: "Kenya", value: KE }
          - { label: "Morocco", value: MA }
          - { label: "Mozambique", value: MZ }
          - { label: "Nigeria", value: NG }
          - { label: "Rwanda", value: RW }
          - { label: "Saudi Arabia", value: SA }
          - { label: "Senegal", value: SN }
          - { label: "Singapore", value: SG }
          - { label: "South Africa", value: ZA }
          - { label: "South Korea", value: KR }
          - { label: "Tanzania", value: TZ }
          - { label: "Uganda", value: UG }
          - { label: "United Arab Emirates", value: AE }
          - { label: "United Kingdom", value: GB }
          - { label: "United States", value: US }
          - { label: "Zambia", value: ZM }
      - { name: article, label: "Article lié (nom du fichier, ex. the-price-of-time)", widget: string, required: false }
      - { name: body, label: "Commentaire", widget: markdown }

  - name: reports
    label: "Rapports et PDF"
    label_singular: "Rapport ou document PDF"
    description: "Rapports, notes de synthèse, présentations : un PDF à télécharger, avec sa couverture fabriquée automatiquement."
    folder: content/reports
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: standfirst, label: "Résumé", widget: text }
      - { name: date, label: "Date", widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: series, label: "Collection (ex. Research Report, Briefing, Presentation)", widget: string, default: "Research Report" }
      - { name: number, label: "Numéro", widget: string }
      - { name: pdf, label: "PDF", widget: file, media_folder: /public/documents, public_folder: /documents }
      - { name: article, label: "Article lié (nom du fichier)", widget: string, required: false }
      - { name: key_messages, label: "Messages clés", widget: list, required: false, field: { name: m, label: Message, widget: string } }
      - { name: countries, label: "Pays (codes : GB, CM…)", widget: list, required: false, field: { name: c, label: Code, widget: string } }
      - { name: body, label: "Présentation (facultatif)", widget: markdown, required: false }

  - name: videos
    label: "Vidéos"
    label_singular: "Vidéo"
    description: "Une vidéo YouTube (la vôtre ou une sélection) et votre commentaire."
    folder: content/videos
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: date, label: "Date", widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: youtube, label: "Lien YouTube", widget: string }
      - name: origin
        label: "Origine"
        widget: select
        default: selection
        options:
          - { label: "Ma vidéo", value: mine }
          - { label: "Sélection (vidéo d'un autre)", value: selection }
      - { name: channel, label: "Chaîne (ex. Bloomberg Television)", widget: string, required: false }
      - { name: thumbnail, label: "Vignette (facultatif, sinon celle de YouTube)", widget: image, required: false }
      - { name: sections, label: "Rubriques", widget: select, multiple: true, required: false, options: [economics, finance, ai, leadership, africa, world] }
      - { name: countries, label: "Pays (codes : GB, US, CM…)", widget: list, required: false, field: { name: c, label: Code, widget: string } }
      - { name: draft, label: "Brouillon", widget: boolean, default: false, required: false }
      - { name: body, label: "Commentaire", widget: markdown }

  - name: events
    label: "Événements"
    label_singular: "Événement"
    description: "Conférences, panels, interventions, événements YouthShare."
    folder: content/events
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: date, label: "Date", widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: kind, label: "Type (Talk, Panel, Conference, Community)", widget: string, default: "Talk" }
      - { name: place, label: "Lieu", widget: string, required: false }
      - { name: link, label: "Lien d'inscription (facultatif)", widget: string, required: false }
      - { name: draft, label: "Brouillon", widget: boolean, default: false, required: false }
      - { name: body, label: "Présentation", widget: markdown, required: false }

  - name: pages
    label: "Pages"
    label_singular: "Page"
    description: "Pages du pied de page : conditions, confidentialité, YouthShare Initiatives, services…"
    folder: content/pages
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: order, label: "Ordre", widget: number, value_type: int, required: false }
      - { name: body, label: "Texte", widget: markdown }

  - name: settings
    label: "Réglages du site"
    files:
      - name: site
        label: "Présentation, contact, chiffres clés"
        file: content/site.json
        format: json
        fields:
          - { name: name, label: "Nom", widget: string }
          - { name: description, label: "Description (Google, partages)", widget: text }
          - { name: phone, label: "Téléphone", widget: string }
          - { name: email, label: "Email", widget: string }
          - { name: linkedin, label: "LinkedIn", widget: string }
          - { name: x, label: "X", widget: string }
          - { name: bio, label: "Présentation (À propos)", widget: list, field: { name: p, label: Paragraphe, widget: text } }
          - { name: facts, label: "Encadrés À propos", widget: list, fields: [{ name: title, label: Titre, widget: string }, { name: text, label: Texte, widget: string }] }
          - { name: why_title, label: "Pourquoi j'écris : phrase en grand", widget: string }
          - { name: why, label: "Pourquoi j'écris : paragraphes", widget: list, field: { name: p, label: Paragraphe, widget: text } }
          - { name: key_figures_date, label: "Chiffres clés : date", widget: string }
          - { name: key_figures, label: "Chiffres clés (bandeau de l'accueil)", widget: list, fields: [{ name: label, label: Libellé, widget: string }, { name: value, label: Valeur, widget: string }] }
          - { name: countries_bar, label: "Pays de la barre du haut (codes : GB, US, CM…)", widget: list, field: { name: c, label: Code, widget: string } }
          - { name: search_chips, label: "Mots proposés sous la recherche", widget: list, field: { name: w, label: Mot, widget: string } }
