  - name: reflexions
    label: "Réflexions"
    label_singular: "Réflexion"
    description: "Textes courts, citations, hommages."
    folder: src/content/reflexions
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    summary: "{{date}} · {{titre}}{{citation}}"
    sortable_fields: [date]
    fields:
      - { name: date, label: "Date", widget: datetime, time_format: false, date_format: "DD/MM/YYYY" }
      - { name: langue, label: "Langue", widget: select, options: *langues, default: fr }
      - { name: titre, label: "Titre (facultatif)", widget: string, required: false }
      - { name: citation, label: "Citation (facultatif)", widget: text, required: false }
      - { name: auteur, label: "Auteur de la citation", widget: string, required: false }
      - { name: image, label: "Photo (facultatif)", widget: image, required: false }
      - { name: rubriques, label: "Rubriques (facultatif)", widget: select, multiple: true, required: false, options: *rubriques }
      - { name: pays, label: "Pays concernés (facultatif)", widget: select, multiple: true, required: false, options: *pays }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false }
      - { name: body, label: "Votre texte", widget: markdown }

  - name: videos
    label: "Vidéos"
    label_singular: "Vidéo"
    description: "Vos vidéos ou une sélection YouTube : collez le lien de la vidéo, ajoutez votre avis."
    folder: src/content/videos
    create: true
    identifier_field: titre
    slug: "{{slug}}"
    summary: "{{titre}}"
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: youtube, label: "Lien YouTube (ex. https://www.youtube.com/watch?v=...)", widget: string }
      - { name: origine, label: "C'est", widget: select, options: [{ label: "Ma vidéo", value: moi }, { label: "Une sélection (vidéo d'un autre)", value: selection }], default: selection }
      - { name: chaine, label: "Chaîne ou source (ex. Bloomberg, CNBC)", widget: string, required: false }
      - { name: date, label: "Date", widget: datetime, time_format: false, date_format: "DD/MM/YYYY" }
      - { name: langue, label: "Langue", widget: select, options: *langues, default: en }
      - { name: rubriques, label: "Rubriques", widget: select, multiple: true, required: false, options: *rubriques }
      - { name: pays, label: "Pays concernés (facultatif)", widget: select, multiple: true, required: false, options: *pays }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false }
      - { name: pointsCles, label: "Points clés de la vidéo (facultatif)", widget: list, required: false, field: { name: point, label: "Point", widget: string } }
      - { name: body, label: "Votre analyse et votre commentaire", widget: markdown, required: false }

  - name: rapports
    label: "Rapports (PDF)"
    label_singular: "Rapport"
    description: "Documents PDF : notes, études, présentations."
    folder: src/content/rapports
    create: true
    identifier_field: titre
    slug: "{{slug}}"
    summary: "{{titre}}"
    media_folder: /public/documents
    public_folder: /documents
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: chapeau, label: "Résumé en une ou deux phrases", widget: text, required: false }
      - { name: pdf, label: "Fichier PDF", widget: file }
      - { name: couverture, label: "Image de couverture (facultatif)", widget: image, required: false }
      - { name: pages, label: "Nombre de pages (facultatif)", widget: number, required: false }
      - { name: date, label: "Date", widget: datetime, time_format: false, date_format: "DD/MM/YYYY" }
      - { name: langue, label: "Langue", widget: select, options: *langues, default: en }
      - { name: rubriques, label: "Rubriques", widget: select, multiple: true, required: false, options: *rubriques }
      - { name: pays, label: "Pays concernés (facultatif)", widget: select, multiple: true, required: false, options: *pays }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false }
      - { name: body, label: "Présentation du document (facultatif)", widget: markdown, required: false }

  - name: graphiques
    label: "Graphiques"
    label_singular: "Graphique"
    description: "Un graphique commenté (le graphique de la semaine)."
    folder: src/content/graphiques
    create: true
    identifier_field: titre
    slug: "{{slug}}"
    summary: "{{titre}}"
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: date, label: "Date", widget: datetime, time_format: false, date_format: "DD/MM/YYYY" }
      - { name: langue, label: "Langue", widget: select, options: *langues, default: en }
      - { name: image, label: "Graphique (PNG ou JPG)", widget: image }
      - { name: source, label: "Source", widget: string, required: false }
      - { name: rubriques, label: "Rubriques", widget: select, multiple: true, required: false, options: *rubriques }
      - { name: pays, label: "Pays concernés (facultatif)", widget: select, multiple: true, required: false, options: *pays }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false }
      - { name: body, label: "Commentaire", widget: markdown, required: false }

  - name: profil
    label: "Mon profil"
    description: "Présentation affichée sur l'accueil et la page À propos."
    files:
      - name: profil
        label: "Présentation (anglais et français)"
        file: src/data/profil.json
        fields:
          - name: en
            label: "English"
            widget: object
            fields: &profil
              - { name: titre, label: "Métier (une ligne)", widget: string }
              - { name: accroche, label: "Accroche", widget: string }
              - { name: bio, label: "Présentation courte", widget: text }
              - { name: role, label: "Domaines", widget: string }
              - { name: apropos, label: "Paragraphes de la page À propos", widget: list, field: { name: p, label: "Paragraphe", widget: text } }
              - { name: ville, label: "Ville", widget: string }
              - { name: formation, label: "Formation", widget: string }
          - name: fr
            label: "Français"
            widget: object
            fields: *profil
