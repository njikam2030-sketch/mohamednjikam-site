# Espace de publication : adresse-du-site/admin
# Connexion avec un jeton GitHub (voir LISEZMOI.md). Chaque enregistrement met le site à jour automatiquement.
backend:
  name: github
  repo: njikam2030-sketch/mohamednjikam-site
  branch: main

locale: fr
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: analyses
    label: "Analyses"
    label_singular: "Analyse"
    description: "Articles de fond : thèse, preuves, objections, que faire, sources."
    folder: src/content/analyses
    create: true
    identifier_field: titre
    slug: "{{slug}}"
    summary: "{{titre}} · {{langue}}"
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: chapeau, label: "Chapeau (résumé sous le titre, Google, LinkedIn)", widget: text, required: false }
      - { name: date, label: "Date", widget: datetime, time_format: false, date_format: "DD/MM/YYYY" }
      - { name: langue, label: "Langue", widget: select, options: &langues [{ label: "English", value: en }, { label: "Français", value: fr }], default: en }
      - name: rubriques
        label: "Rubriques"
        widget: select
        multiple: true
        min: 1
        options: &rubriques
          - { label: "États-Unis", value: us }
          - { label: "IPO et fusions (M&A)", value: deals }
          - { label: "Hedge funds et investissement", value: funds }
          - { label: "IA et finance", value: ai }
          - { label: "Dette et taux", value: debt }
          - { label: "Londres et Royaume-Uni", value: uk }
          - { label: "Afrique", value: africa }
          - { label: "Asie", value: asia }
